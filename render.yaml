# Blueprint для Render. Файл можно не использовать: те же настройки задаются вручную в панели.
services:
  - type: web
    name: zakaz-bot
    runtime: python
    plan: starter            # постоянный диск доступен только на платных планах
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: BOT_TOKEN
        sync: false
      - key: SUPPLIER_IDS
        sync: false
      - key: PAY_PHONE
        sync: false
      - key: PAY_BANK
        sync: false
      - key: DB_PATH
        value: /var/data/orders.db
    disk:
      name: orders-data
      mountPath: /var/data
      sizeGB: 1
